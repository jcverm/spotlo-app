<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spotlo</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Spotlo" />
  <meta property="og:title" content="Spotlo" />
  <meta property="og:description" content="Garde et partage tes lieux · Save and share your places · Salva e condividi i luoghi" />
  <meta property="og:image" content="https://jcverm.github.io/spotlo-app/og-image.png" />
  <meta property="og:image:secure_url" content="https://jcverm.github.io/spotlo-app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Spotlo" />
  <meta property="og:url" content="https://jcverm.github.io/spotlo-app/claim" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Spotlo" />
  <meta name="twitter:description" content="Garde et partage tes lieux · Save and share your places · Salva e condividi i luoghi" />
  <meta name="twitter:image" content="https://jcverm.github.io/spotlo-app/og-image.png" />
  <style>
    :root { --blue: #0A6E97; --ink: #111; --muted: #667; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff; color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card { width: 100%; max-width: 380px; text-align: center; }
    .pin { width: 84px; height: 110px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p.lead { color: var(--muted); font-size: 16px; margin: 0 0 28px; line-height: 1.4; }
    .btn {
      display: block; width: 100%; text-decoration: none; text-align: center;
      border-radius: 12px; padding: 15px 16px; font-size: 16px; font-weight: 700;
      margin: 10px 0; cursor: pointer; border: none;
    }
    .primary { background: var(--blue); color: #fff; }
    .ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
    .codewrap { margin: 22px 0 4px; }
    .codelabel { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--blue);
      background: #f2f6f8; border: 1px dashed var(--blue); border-radius: 12px;
      padding: 14px 16px; width: 100%; cursor: pointer;
    }
    .copied { color: var(--blue); font-size: 13px; height: 16px; margin: 6px 0 0; opacity: 0; transition: opacity .2s; }
    .copied.show { opacity: 1; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.4; }
    .wordmark { font-weight: 800; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="pin" viewBox="0 0 84 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M42 2C20.5 2 3 19.5 3 41c0 27 39 67 39 67s39-40 39-67C81 19.5 63.5 2 42 2z" fill="#0A6E97"/>
      <text x="42" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#fff">S</text>
    </svg>

    <h1><span class="wordmark">Spotlo</span></h1>
    <p class="lead" id="lead">On t'a partagé quelque chose sur Spotlo.</p>

    <a class="btn primary" id="openBtn" href="spotlo://claim">Ouvrir dans Spotlo</a>
    <a class="btn ghost" id="iosBtn" href="https://apps.apple.com/app/id6778313920">Télécharger sur l'App Store</a>
    <a class="btn ghost" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.spotlo.app">Télécharger sur Google Play</a>

    <div class="codewrap" id="codewrap" style="display:none;">
      <p class="codelabel" id="codelabel">Ton code</p>
      <button class="code" id="codeBtn" type="button"></button>
      <p class="copied" id="copied">Copié</p>
    </div>

    <p class="hint" id="hint">Pas encore l'app ? Installe-la, puis saisis ce code dans l'app.</p>
  </div>

  <script>
    try {
      var STR = {
        fr: {
          leadDefault: "On t'a partagé quelque chose sur Spotlo.",
          leads: {
            invite: "Tu as reçu une invitation à rejoindre une communauté sur Spotlo.",
            place: "On t'a partagé un lieu sur Spotlo.",
            visit: "On t'a partagé une visite sur Spotlo.",
            album: "On t'a partagé un carnet sur Spotlo."
          },
          open: "Ouvrir dans Spotlo",
          storeIos: "Télécharger sur l'App Store",
          storeAndroid: "Télécharger sur Google Play",
          codeLabel: "Ton code",
          copied: "Copié",
          hint: "Pas encore l'app ? Installe-la, puis saisis ce code dans l'app."
        },
        en: {
          leadDefault: "Something was shared with you on Spotlo.",
          leads: {
            invite: "You've been invited to join a community on Spotlo.",
            place: "A place was shared with you on Spotlo.",
            visit: "A visit was shared with you on Spotlo.",
            album: "A notebook was shared with you on Spotlo."
          },
          open: "Open in Spotlo",
          storeIos: "Download on the App Store",
          storeAndroid: "Get it on Google Play",
          codeLabel: "Your code",
          copied: "Copied",
          hint: "Don't have the app yet? Install it, then enter this code in the app."
        },
        it: {
          leadDefault: "Ti è stato condiviso qualcosa su Spotlo.",
          leads: {
            invite: "Hai ricevuto un invito a unirti a una comunità su Spotlo.",
            place: "Ti è stato condiviso un luogo su Spotlo.",
            visit: "Ti è stata condivisa una visita su Spotlo.",
            album: "Ti è stato condiviso un taccuino su Spotlo."
          },
          open: "Apri in Spotlo",
          storeIos: "Scarica su App Store",
          storeAndroid: "Scarica su Google Play",
          codeLabel: "Il tuo codice",
          copied: "Copiato",
          hint: "Non hai ancora l'app? Installala, poi inserisci questo codice nell'app."
        }
      };

      var nav = (navigator.language || "fr").toLowerCase();
      var lang = nav.indexOf("fr") === 0 ? "fr" : nav.indexOf("it") === 0 ? "it" : "en";
      var S = STR[lang];
      document.documentElement.lang = lang;

      var params = new URLSearchParams(location.search);
      var type = params.get("type");
      var token = params.get("token");

      document.getElementById("lead").textContent = (type && S.leads[type]) ? S.leads[type] : S.leadDefault;
      document.getElementById("openBtn").textContent = S.open;

      var iosBtn = document.getElementById("iosBtn");
      var androidBtn = document.getElementById("androidBtn");
      iosBtn.textContent = S.storeIos;
      androidBtn.textContent = S.storeAndroid;

      // Détection de l'OS : on montre le store pertinent, on cache l'autre.
      // Si l'OS n'est pas reconnu (desktop), les deux boutons restent visibles.
      var ua = (navigator.userAgent || navigator.vendor || "").toLowerCase();
      var isAndroid = ua.indexOf("android") > -1;
      var isIOS = /iphone|ipad|ipod/.test(ua);
      if (isAndroid) { iosBtn.style.display = "none"; }
      else if (isIOS) { androidBtn.style.display = "none"; }

      document.getElementById("codelabel").textContent = S.codeLabel;
      document.getElementById("copied").textContent = S.copied;
      document.getElementById("hint").textContent = S.hint;

      if (token && type) {
        document.getElementById("openBtn").setAttribute(
          "href",
          "spotlo://claim?type=" + encodeURIComponent(type) + "&token=" + encodeURIComponent(token)
        );
      }

      if (token) {
        var codeBtn = document.getElementById("codeBtn");
        codeBtn.textContent = token;
        document.getElementById("codewrap").style.display = "block";
        codeBtn.addEventListener("click", function () {
          function done() {
            var c = document.getElementById("copied");
            c.classList.add("show");
            setTimeout(function () { c.classList.remove("show"); }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(token).then(done).catch(done);
          } else {
            done();
          }
        });
      }
    } catch (e) {
      // Si le JS casse, la page reste utilisable : textes en dur et les deux boutons de store actifs.
    }
  </script>
</body>
</html>
