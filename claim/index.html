<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spotlo</title>
  <style>
    :root { --blue: #0A6E97; --ink: #111; --muted: #667; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff; color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card { width: 100%; max-width: 380px; text-align: center; }
    .pin { width: 84px; height: 110px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p.lead { color: var(--muted); font-size: 16px; margin: 0 0 28px; line-height: 1.4; }
    .btn {
      display: block; width: 100%; text-decoration: none;
      border-radius: 12px; padding: 15px 16px; font-size: 16px; font-weight: 700;
      margin: 10px 0; cursor: pointer; border: none;
    }
    .primary { background: var(--blue); color: #fff; }
    .ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
    .codewrap { margin: 18px 0 4px; }
    .codelabel { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--blue);
      background: #f2f6f8; border: 1px dashed var(--blue); border-radius: 12px;
      padding: 14px 16px; width: 100%; cursor: pointer;
    }
    .copied { color: var(--blue); font-size: 13px; height: 16px; margin: 6px 0 0; opacity: 0; transition: opacity .2s; }
    .copied.show { opacity: 1; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.4; }
    .wordmark { font-weight: 800; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="pin" viewBox="0 0 84 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M42 2C20.5 2 3 19.5 3 41c0 27 39 67 39 67s39-40 39-67C81 19.5 63.5 2 42 2z" fill="#0A6E97"/>
      <text x="42" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#fff">S</text>
    </svg>

    <h1><span class="wordmark">Spotlo</span></h1>
    <p class="lead" id="lead"></p>

    <a class="btn primary" id="openBtn" href="#"></a>
    <a class="btn ghost" id="storeBtn" href="#"></a>

    <div class="codewrap" id="codewrap" style="display:none;">
      <p class="codelabel" id="codelabel"></p>
      <button class="code" id="codeBtn" type="button"></button>
      <p class="copied" id="copied"></p>
    </div>

    <p class="hint" id="hint"></p>
  </div>

  <script>
    (function () {
      var APP_STORE_URL = "https://apps.apple.com/app/id6778313920";
      var STORE_READY = true; // lien App Store reel, redirection active

      var STR = {
        fr: {
          leadDefault: "On t'a partagé quelque chose sur Spotlo.",
          leads: {
            invite: "Tu as reçu une invitation à rejoindre une communauté sur Spotlo.",
            place: "On t'a partagé un lieu sur Spotlo.",
            visit: "On t'a partagé une visite sur Spotlo.",
            album: "On t'a partagé un carnet sur Spotlo."
          },
          open: "Ouvrir dans Spotlo",
          store: "Télécharger sur l'App Store",
          codeLabel: "Ton code",
          copied: "Copié",
          hintInstalled: "Si l'app est installée, elle s'ouvre toute seule.",
          hintInstall: "Pas encore l'app ? Installe-la, puis rouvre ce lien ou saisis ce code dans l'app."
        },
        en: {
          leadDefault: "Something was shared with you on Spotlo.",
          leads: {
            invite: "You've been invited to join a community on Spotlo.",
            place: "A place was shared with you on Spotlo.",
            visit: "A visit was shared with you on Spotlo.",
            album: "A notebook was shared with you on Spotlo."
          },
          open: "Open in Spotlo",
          store: "Download on the App Store",
          codeLabel: "Your code",
          copied: "Copied",
          hintInstalled: "If the app is installed, it opens on its own.",
          hintInstall: "Don't have the app yet? Install it, then reopen this link or enter this code in the app."
        },
        it: {
          leadDefault: "Ti è stato condiviso qualcosa su Spotlo.",
          leads: {
            invite: "Hai ricevuto un invito a unirti a una comunità su Spotlo.",
            place: "Ti è stato condiviso un luogo su Spotlo.",
            visit: "Ti è stata condivisa una visita su Spotlo.",
            album: "Ti è stato condiviso un taccuino su Spotlo."
          },
          open: "Apri in Spotlo",
          store: "Scarica su App Store",
          codeLabel: "Il tuo codice",
          copied: "Copiato",
          hintInstalled: "Se l'app è installata, si apre da sola.",
          hintInstall: "Non hai ancora l'app? Installala, poi riapri questo link o inserisci questo codice nell'app."
        }
      };

      var nav = (navigator.language || navigator.userLanguage || "fr").toLowerCase();
      var lang = nav.indexOf("fr") === 0 ? "fr" : nav.indexOf("it") === 0 ? "it" : "en";
      var S = STR[lang];
      document.documentElement.lang = lang;

      var params = new URLSearchParams(location.search);
      var type = params.get("type");
      var token = params.get("token");

      document.getElementById("lead").textContent = (type && S.leads[type]) ? S.leads[type] : S.leadDefault;
      document.getElementById("openBtn").textContent = S.open;
      document.getElementById("storeBtn").textContent = S.store;
      document.getElementById("codelabel").textContent = S.codeLabel;
      document.getElementById("copied").textContent = S.copied;

      var scheme = "spotlo://";
      if (token && type) {
        scheme = "spotlo://claim?type=" + encodeURIComponent(type) + "&token=" + encodeURIComponent(token);
      }

      function openApp() { window.location.href = scheme; }
      function goStore() { window.location.href = APP_STORE_URL; }

      document.getElementById("openBtn").addEventListener("click", function (e) {
        e.preventDefault(); openApp();
      });
      document.getElementById("storeBtn").addEventListener("click", function (e) {
        e.preventDefault(); goStore();
      });

      if (token) {
        var codeBtn = document.getElementById("codeBtn");
        codeBtn.textContent = token;
        document.getElementById("codewrap").style.display = "block";
        codeBtn.addEventListener("click", function () {
          function done() {
            var c = document.getElementById("copied");
            c.classList.add("show");
            setTimeout(function () { c.classList.remove("show"); }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(token).then(done).catch(function () {});
          } else {
            done();
          }
        });
      }

      var fellBack = false;
      function fallback() {
        if (fellBack) return;
        fellBack = true;
        if (STORE_READY) goStore();
      }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) fellBack = true;
      });
      window.addEventListener("pagehide", function () { fellBack = true; });

      window.addEventListener("load", function () {
        setTimeout(openApp, 200);
        setTimeout(fallback, 1600);
      });

      document.getElementById("hint").textContent = token ? S.hintInstall : S.hintInstalled;
    })();
  </script>
</body>
</html>
