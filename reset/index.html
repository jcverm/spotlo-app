<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spotlo</title>
  <style>
    :root { --blue: #0A6E97; --ink: #111; --muted: #667; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff; color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card { width: 100%; max-width: 380px; text-align: center; }
    .pin { width: 84px; height: 110px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p.lead { color: var(--muted); font-size: 16px; margin: 0 0 24px; line-height: 1.4; }
    input {
      width: 100%; border: 1px solid #ccc; border-radius: 12px;
      padding: 15px 16px; font-size: 16px; margin: 8px 0; color: var(--ink);
    }
    .btn {
      display: block; width: 100%; text-decoration: none;
      border-radius: 12px; padding: 15px 16px; font-size: 16px; font-weight: 700;
      margin: 10px 0; cursor: pointer; border: none;
    }
    .primary { background: var(--blue); color: #fff; }
    .msg { font-size: 14px; min-height: 18px; margin-top: 12px; line-height: 1.4; }
    .ok { color: var(--blue); }
    .err { color: #b00; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.4; }
    .wordmark { font-weight: 800; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="pin" viewBox="0 0 84 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M42 2C20 2 2 20 2 42c0 28 40 66 40 66s40-38 40-66C82 20 64 2 42 2z" fill="#0A6E97"/>
      <text x="42" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#fff">S</text>
    </svg>
    <h1 class="wordmark">Spotlo</h1>
    <p class="lead" id="lead">Choisis un nouveau mot de passe.</p>

    <div id="form">
      <input id="pwd" type="password" autocomplete="new-password" placeholder="Nouveau mot de passe" />
      <input id="pwd2" type="password" autocomplete="new-password" placeholder="Confirme le mot de passe" />
      <button class="btn primary" id="save">Enregistrer</button>
    </div>

    <p class="msg" id="msg"></p>
    <p class="hint" id="hint">Une fois changé, reviens dans l'app et connecte-toi.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Remplace la clé ci-dessous par ta valeur EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (clé publique, sans risque).
    var SUPABASE_URL = "https://bnauwgsbgzslacodtvul.supabase.co";
    var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2jdDZ_knr0n5tN-hvz0n9A_d4Lfg4Di";

    var L = (navigator.language || "fr").slice(0,2).toLowerCase();
    var T = {
      fr: { lead:"Choisis un nouveau mot de passe.", pwd:"Nouveau mot de passe", pwd2:"Confirme le mot de passe",
            save:"Enregistrer", saving:"Enregistrement…", hint:"Une fois changé, reviens dans l'app et connecte-toi.",
            tooShort:"6 caractères minimum.", noMatch:"Les deux mots de passe ne correspondent pas.",
            done:"Mot de passe changé. Tu peux te connecter.", noSession:"Lien invalide ou expiré. Redemande un email depuis l'app." },
      en: { lead:"Choose a new password.", pwd:"New password", pwd2:"Confirm password",
            save:"Save", saving:"Saving…", hint:"Once changed, go back to the app and sign in.",
            tooShort:"At least 6 characters.", noMatch:"The two passwords do not match.",
            done:"Password changed. You can sign in now.", noSession:"Invalid or expired link. Request a new email from the app." },
      it: { lead:"Scegli una nuova password.", pwd:"Nuova password", pwd2:"Conferma password",
            save:"Salva", saving:"Salvataggio…", hint:"Una volta cambiata, torna nell'app e accedi.",
            tooShort:"Almeno 6 caratteri.", noMatch:"Le due password non coincidono.",
            done:"Password cambiata. Ora puoi accedere.", noSession:"Link non valido o scaduto. Richiedi una nuova email dall'app." }
    };
    var tr = T[L] || T.fr;
    document.documentElement.lang = T[L] ? L : "fr";
    document.getElementById("lead").textContent = tr.lead;
    document.getElementById("pwd").placeholder = tr.pwd;
    document.getElementById("pwd2").placeholder = tr.pwd2;
    document.getElementById("save").textContent = tr.save;
    document.getElementById("hint").textContent = tr.hint;

    var msg = document.getElementById("msg");
    function show(text, kind){ msg.textContent = text; msg.className = "msg " + (kind||""); }

    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { detectSessionInUrl: true, flowType: "implicit" }
    });

    var hasRecovery = false;
    sb.auth.onAuthStateChange(function(event){
      if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") hasRecovery = true;
    });

    document.getElementById("save").addEventListener("click", async function(){
      var p1 = document.getElementById("pwd").value;
      var p2 = document.getElementById("pwd2").value;
      if (p1.length < 6) { show(tr.tooShort, "err"); return; }
      if (p1 !== p2) { show(tr.noMatch, "err"); return; }
      var btn = document.getElementById("save");
      btn.disabled = true; btn.textContent = tr.saving;
      var res = await sb.auth.getSession();
      if (!res.data || !res.data.session) { show(tr.noSession, "err"); btn.disabled = false; btn.textContent = tr.save; return; }
      var upd = await sb.auth.updateUser({ password: p1 });
      if (upd.error) { show(upd.error.message, "err"); btn.disabled = false; btn.textContent = tr.save; return; }
      document.getElementById("form").style.display = "none";
      show(tr.done, "ok");
    });
  </script>
</body>
</html>
